name: Validar Dart
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Analisar e testar
        run: docker run --rm -v "$PWD:/work" -w /work dart:3.5.4 sh -c 'dart analyze bin/main.dart && dart run bin/main.dart --self-test'
